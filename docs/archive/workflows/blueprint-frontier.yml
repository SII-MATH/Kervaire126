name: Blueprint frontier

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueprint-frontier-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read open tasks
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,title,body,url > "$RUNNER_TEMP/issues.json"
      - name: Generate frontier reports
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/blueprint_frontier.py --issues "$RUNNER_TEMP/issues.json" --output-dir frontier
          cat frontier/preview.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blueprint-frontier
          path: frontier/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: generate
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: blueprint-frontier
          path: frontier/
      - name: Update the single bot-owned issue comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_blueprint_frontier.py frontier/preview.md
