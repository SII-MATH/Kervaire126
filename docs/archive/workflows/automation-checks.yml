name: Automation checks

# Candidate automation must be tested BEFORE it becomes trusted on main.
# No secrets, write permissions, Lean build, or project cache publication here.
on:
  pull_request:
    paths:
      - '.github/**'
      - 'scripts/**'
      - 'docs/migration/kip-base/**'
      - 'MainPaper/**'
      - 'Source/**'
      - 'docs/external-inputs.json'
      - 'KIP126/Interface/Challenge/**'
      - 'KIP126/LinProgram/**'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'scripts/**'
      - 'docs/migration/kip-base/**'
      - 'MainPaper/**'
      - 'Source/**'
      - 'docs/external-inputs.json'
      - 'KIP126/Interface/Challenge/**'
      - 'KIP126/LinProgram/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  automation-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned syntax tools
        run: |
          python3 -m pip install PyYAML==6.0.2
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"

      - name: Validate workflow expressions and automation syntax
        run: |
          # Pinned checkout v4 supports this input; actionlint's bundled schema
          # predates it and the September 2026 job-level cache-mode field.
          # Suppress only these two documented schema mismatches.
          actionlint -shellcheck= -pyflakes= \
            -ignore 'input "allow-unsafe-pr-checkout" is not defined in action' \
            -ignore 'unexpected key "cache-mode" for "job" section'
          python3 scripts/check_ci_syntax.py

      - name: Run automation regression tests without Lean
        env:
          PYTHONPATH: .:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest -v \
            scripts.test_development_gates \
            scripts.test_ci_fast_path \
            scripts.test_ci_optimizations \
            scripts.test_workflow_routing \
            scripts.test_merge_gate \
            scripts.test_docs_helpers \
            scripts.test_kipbase_migration \
            scripts.test_check_source_inventory \
            scripts.test_external_inputs \
            scripts.test_stage_boundary_layout \
            scripts.perf.test_perf \
            scripts.pr_status.test_pr_status
          if [[ -f scripts/test_lean_cache_wait.py ]]; then
            python3 -m unittest scripts.test_lean_cache_wait -v
          fi

      - name: Check migrated source inventory and Lin translators
        run: |
          python3 scripts/check_external_inputs.py
          python3 scripts/test-import-lin-selected.py
          python3 KIP126/LinProgram/Translate/import-proofs.py --self-test
