name: Blueprint and API docs

on:
  push:
    branches: [main]
    paths:
      - "blueprint/src/**"
      - "requirements-blueprint.txt"
      - "KIP126.lean"
      - "KIP126/*.lean"
      - "KIP126/**/*.lean"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "docbuild/**"
      - "scripts/docs/**"
      - "scripts/test_workflow_routing.py"
      - "scripts/test_lean_cache_wait.py"
      - ".github/workflows/pages.yml"
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "blueprint/src/**"
      - "requirements-blueprint.txt"
      - "KIP126.lean"
      - "KIP126/*.lean"
      - "KIP126/**/*.lean"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "docbuild/**"
      - "scripts/docs/**"
      - "scripts/test_workflow_routing.py"
      - "scripts/test_lean_cache_wait.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      blueprint: ${{ steps.paths.outputs.blueprint }}
      docs: ${{ steps.paths.outputs.docs }}
      links: ${{ steps.paths.outputs.links }}
      cold: ${{ steps.paths.outputs.cold }}
      checkout_ref: ${{ steps.paths.outputs.checkout_ref }}
      base_sha: ${{ steps.paths.outputs.base_sha }}
      build_cache_digest: ${{ steps.paths.outputs.build_cache_digest }}
      lean_producer: ${{ steps.paths.outputs.lean_producer }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          blueprint=false
          lean=false
          config=false
          cold=false
          lean_producer=ci.yml
          checkout_ref=$CURRENT_SHA
          base_sha=$CURRENT_SHA

          case "$EVENT_NAME" in
            pull_request)
              checkout_ref=$PR_HEAD_SHA
              base_sha=$PR_BASE_SHA
              gh api --paginate \
                "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
                --jq '.[].filename' > "$RUNNER_TEMP/changed-paths"
              ;;
            push)
              if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
                config=true
              else
                git diff --name-only "$BEFORE_SHA...$CURRENT_SHA" > "$RUNNER_TEMP/changed-paths"
              fi
              ;;
            schedule|workflow_dispatch)
              blueprint=true
              lean=true
              config=true
              cold=true
              ;;
          esac

          if [[ -f "$RUNNER_TEMP/changed-paths" ]]; then
            # pr-build skips only Blueprint-source-only PRs. Even an
            # infrastructure-only PR can produce the same-input cache.
            if [[ "$EVENT_NAME" == pull_request ]] && grep -qv '^blueprint/src/' "$RUNNER_TEMP/changed-paths"; then
              lean_producer=pr-build.yml
            fi
            while IFS= read -r path; do
              case "$path" in
                blueprint/src/*) blueprint=true ;;
                KIP126.lean|KIP126/*.lean) lean=true ;;
                requirements-blueprint.txt) blueprint=true ;;
                lakefile.lean|lake-manifest.json|lean-toolchain|docbuild/*|scripts/docs/*|scripts/test_workflow_routing.py|scripts/test_lean_cache_wait.py|.github/workflows/pages.yml)
                  config=true
                  ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
            echo "Changed paths:"
            cat "$RUNNER_TEMP/changed-paths"
          fi

          if [[ $config == true ]]; then
            blueprint=true
            lean=true
          fi
          if [[ $blueprint == true || $lean == true ]]; then
            links=true
          else
            links=false
          fi

          # Hash the trusted base's committed Lean/build inputs rather than its commit id. During
          # this rollout the base may predate the helper, so use the checked-out copy only for that
          # one case; once merged, all PRs execute the helper from their trusted current base.
          key_script="$RUNNER_TEMP/ci-build-cache-key.sh"
          if git cat-file -e "$base_sha:scripts/ci-build-cache-key.sh" 2>/dev/null; then
            git show "$base_sha:scripts/ci-build-cache-key.sh" > "$key_script"
          else
            cp scripts/ci-build-cache-key.sh "$key_script"
          fi
          build_cache_digest=$(bash "$key_script" . "$base_sha")
          {
            echo "blueprint=$blueprint"
            echo "docs=$lean"
            echo "links=$links"
            echo "cold=$cold"
            echo "checkout_ref=$checkout_ref"
            echo "base_sha=$base_sha"
            echo "build_cache_digest=$build_cache_digest"
            echo "lean_producer=$lean_producer"
          } >> "$GITHUB_OUTPUT"

      - name: Test documentation helpers
        run: |
          python3 -m py_compile scripts/docs/*.py
          python3 -m unittest scripts.test_docs_helpers scripts.test_workflow_routing scripts.test_lean_cache_wait -v

  blueprint:
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ needs.classify.outputs.checkout_ref }}
          persist-credentials: false

      - name: Reuse the last successful main Blueprint
        id: reuse
        if: needs.classify.outputs.blueprint != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/docs/restore-component.sh pages.yml site-blueprint component index.html lean_decls revision.json

      - name: Set up Blueprint generator
        if: needs.classify.outputs.blueprint == 'true' || steps.reuse.outcome != 'success'
        run: |
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          packages=(
            ghostscript graphviz libgraphviz-dev pdf2svg pkg-config texlive-latex-base
          )
          use_canonical_mirror() {
            sudo sed -i \
              's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|' \
              /etc/apt/sources.list.d/ubuntu.sources
          }
          if ! sudo timeout --kill-after=10s 120s apt-get "${apt_options[@]}" update; then
            use_canonical_mirror
            sudo timeout --kill-after=10s 120s apt-get "${apt_options[@]}" update
          fi
          if ! sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" \
            install --download-only --yes "${packages[@]}"; then
            use_canonical_mirror
            sudo timeout --kill-after=10s 120s apt-get "${apt_options[@]}" update
            sudo timeout --kill-after=10s 600s apt-get "${apt_options[@]}" \
              install --download-only --yes "${packages[@]}"
          fi
          sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" \
            install --no-download --yes "${packages[@]}"
          python3 -m venv "$RUNNER_TEMP/blueprint-venv"
          "$RUNNER_TEMP/blueprint-venv/bin/pip" install -r requirements-blueprint.txt
          echo "$RUNNER_TEMP/blueprint-venv/bin" >> "$GITHUB_PATH"

      - name: Build Blueprint component
        if: needs.classify.outputs.blueprint == 'true' || steps.reuse.outcome != 'success'
        env:
          BUILD_SHA: ${{ needs.classify.outputs.checkout_ref }}
          BUILD_MODE: ${{ needs.classify.outputs.cold == 'true' && 'cold' || 'rebuild' }}
        run: |
          printf '| Command | Elapsed | Exit |\n| --- | ---: | ---: |\n' >> "$GITHUB_STEP_SUMMARY"
          bash scripts/docs/measure.sh "leanblueprint-web-$BUILD_MODE" metrics/blueprint.tsv \
            "$RUNNER_TEMP/blueprint-venv/bin/leanblueprint" web
          if [[ "$BUILD_MODE" == cold ]]; then
            bash scripts/docs/measure.sh leanblueprint-web-hot metrics/blueprint.tsv \
              "$RUNNER_TEMP/blueprint-venv/bin/leanblueprint" web
          fi
          mkdir -p component
          cp -a blueprint/web/. component/
          cp blueprint/lean_decls component/lean_decls
          python3 scripts/docs/stamp_revision.py component Blueprint "$BUILD_SHA" "$GITHUB_REPOSITORY"

      - name: Verify Blueprint links and revision
        run: |
          test -s component/index.html
          test -s component/lean_decls
          test -s component/revision.json
          grep -R -F 'https://sii-math.github.io/KIP126/docs/find/#doc/' component --include='*.html' -m1
          grep -R -F '${{ needs.classify.outputs.checkout_ref }}' component --include='*.html' -m1 || \
            grep -F '"commit"' component/revision.json

      - name: Record Blueprint reuse state
        run: |
          echo "Blueprint requested rebuild: ${{ needs.classify.outputs.blueprint }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Blueprint artifact restore outcome: ${{ steps.reuse.outcome || 'not attempted' }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-blueprint
          path: component/
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('metrics/blueprint.tsv') != ''
        with:
          name: blueprint-build-metrics
          path: metrics/blueprint.tsv
          retention-days: 30

  docs:
    needs: [classify, links]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'docs-preview')) && needs.classify.result == 'success' && (needs.links.result == 'success' || needs.classify.outputs.links != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DISABLE_EQUATIONS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ needs.classify.outputs.checkout_ref }}
          fetch-depth: 100
          persist-credentials: false

      - name: Reuse the last successful main API docs
        id: reuse
        if: needs.classify.outputs.docs != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/docs/restore-component.sh pages.yml site-docs component index.html revision.json

      - name: Set up Lean
        if: needs.classify.outputs.docs == 'true' || steps.reuse.outcome != 'success'
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Materialize pinned doc-gen4 packages
        if: needs.classify.outputs.docs == 'true' || steps.reuse.outcome != 'success'
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: |
          cd docbuild
          lake update KIP126

      - name: Restore main doc-gen4 incremental state
        id: doc-cache
        if: (needs.classify.outputs.docs == 'true' || steps.reuse.outcome != 'success') && needs.classify.outputs.cold != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            docbuild/.lake/build/api-docs.db
            docbuild/.lake/build/doc-data
            docbuild/.lake/build/doc-manifest.json
            docbuild/.lake/build/doc/Aesop
            docbuild/.lake/build/doc/Batteries
            docbuild/.lake/build/doc/ImportGraph
            docbuild/.lake/build/doc/Init
            docbuild/.lake/build/doc/Lake
            docbuild/.lake/build/doc/Lean
            docbuild/.lake/build/doc/LeanSearchClient
            docbuild/.lake/build/doc/Mathlib
            docbuild/.lake/build/doc/Plausible
            docbuild/.lake/build/doc/ProofWidgets
            docbuild/.lake/build/doc/Qq
            docbuild/.lake/build/doc/Std
            docbuild/.lake/build/doc/declarations
            docbuild/.lake/build/doc/find
            docbuild/.lake/build/doc/*.bib
            docbuild/.lake/build/doc/*.css
            docbuild/.lake/build/doc/*.html
            docbuild/.lake/build/doc/*.js
            docbuild/.lake/build/doc/*.svg
            .lake/packages/BibtexQuery/.lake/build
            .lake/packages/Cli/.lake/build
            .lake/packages/MD4Lean/.lake/build
            .lake/packages/UnicodeBasic/.lake/build
            .lake/packages/doc-gen4/.lake/build
            .lake/packages/leansqlite/.lake/build
          key: kip126-docgen-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lakefile.toml', 'docbuild/lake-manifest.json') }}

      # The links job restored the producer's exact-input outputs (or performed
      # the one explicitly requested cold build). Do not race another compilation.
      - name: Reuse the declaration-check job's Lean outputs
        if: needs.classify.outputs.docs == 'true' || steps.reuse.outcome != 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-lean-outputs
          path: .lake/build

      - name: Fetch Mathlib cache
        if: needs.classify.outputs.docs == 'true' || steps.reuse.outcome != 'success'
        run: |
          printf '| Command | Elapsed | Exit |\n| --- | ---: | ---: |\n' >> "$GITHUB_STEP_SUMMARY"
          bash scripts/docs/measure.sh mathlib-cache-get metrics/docs.tsv \
            bash -o pipefail -c 'lake exe cache get 2>&1 | tee metrics/mathlib-cache.log'
          if grep -qF 'No files to download' metrics/mathlib-cache.log; then
            echo "Mathlib cache result: full hit" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Mathlib cache result: downloaded or refreshed files" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build API documentation
        if: needs.classify.outputs.docs == 'true' || steps.reuse.outcome != 'success'
        env:
          BUILD_SHA: ${{ needs.classify.outputs.checkout_ref }}
          BUILD_MODE: ${{ needs.classify.outputs.cold == 'true' && 'cold' || 'incremental' }}
        run: |
          # Fail on missing/stale project outputs instead of silently rebuilding.
          lake build --no-build
          # Check again in doc-gen4's nested workspace: its dependency setup
          # must accept the same project artifacts before documentation starts.
          (cd docbuild && lake build --no-build KIP126 KIPBase)
          bash scripts/docs/measure.sh "doc-gen4-$BUILD_MODE" metrics/docs.tsv \
            bash -c 'cd docbuild && lake build KIP126:docs'
          bash scripts/docs/verify_docgen_incremental.sh metrics/docs.tsv
          mkdir -p component
          cp -a docbuild/.lake/build/doc/. component/
          python3 scripts/docs/stamp_revision.py component doc-gen4 "$BUILD_SHA" "$GITHUB_REPOSITORY"

      - name: Save main doc-gen4 incremental state
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.outputs.docs == 'true' && needs.classify.outputs.cold != 'true' && steps.doc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            docbuild/.lake/build/api-docs.db
            docbuild/.lake/build/doc-data
            docbuild/.lake/build/doc-manifest.json
            docbuild/.lake/build/doc/Aesop
            docbuild/.lake/build/doc/Batteries
            docbuild/.lake/build/doc/ImportGraph
            docbuild/.lake/build/doc/Init
            docbuild/.lake/build/doc/Lake
            docbuild/.lake/build/doc/Lean
            docbuild/.lake/build/doc/LeanSearchClient
            docbuild/.lake/build/doc/Mathlib
            docbuild/.lake/build/doc/Plausible
            docbuild/.lake/build/doc/ProofWidgets
            docbuild/.lake/build/doc/Qq
            docbuild/.lake/build/doc/Std
            docbuild/.lake/build/doc/declarations
            docbuild/.lake/build/doc/find
            docbuild/.lake/build/doc/*.bib
            docbuild/.lake/build/doc/*.css
            docbuild/.lake/build/doc/*.html
            docbuild/.lake/build/doc/*.js
            docbuild/.lake/build/doc/*.svg
            .lake/packages/BibtexQuery/.lake/build
            .lake/packages/Cli/.lake/build
            .lake/packages/MD4Lean/.lake/build
            .lake/packages/UnicodeBasic/.lake/build
            .lake/packages/doc-gen4/.lake/build
            .lake/packages/leansqlite/.lake/build
          key: kip126-docgen-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lakefile.toml', 'docbuild/lake-manifest.json') }}

      - name: Verify API docs and revision
        run: |
          test -s component/index.html
          test -s component/find/index.html
          test -s component/revision.json
          grep -R -F '${{ needs.classify.outputs.checkout_ref }}' component --include='*.html' -m1 || \
            grep -F '"commit"' component/revision.json

      - name: Record docs cache and reuse state
        run: |
          echo "doc-gen4 cache hit: ${{ steps.doc-cache.outputs.cache-hit || 'not restored' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Lean outputs: reused from this run's declaration-check job" >> "$GITHUB_STEP_SUMMARY"
          echo "API docs requested rebuild: ${{ needs.classify.outputs.docs }}" >> "$GITHUB_STEP_SUMMARY"
          echo "API docs artifact restore outcome: ${{ steps.reuse.outcome || 'not attempted' }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-docs
          path: component/
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('metrics/docs.tsv') != ''
        with:
          name: docs-build-metrics
          path: metrics/docs.tsv
          retention-days: 30

  links:
    needs: [classify, blueprint]
    if: needs.classify.outputs.links == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ needs.classify.outputs.checkout_ref }}
          fetch-depth: 100
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-blueprint
          path: blueprint-component

      - name: Set up Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      # pull_request uses a different workflow commit from pull_request_target.
      # The trusted producer must publish this record on the default branch
      # before this consumer can work; an old run cannot acquire it by rerunning.
      - name: Resolve trusted producer tooling
        id: producer-tooling
        if: needs.classify.outputs.cold != 'true' && needs.classify.outputs.lean_producer == 'pr-build.yml'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.classify.outputs.checkout_ref }}
        run: |
          python3 scripts/docs/wait_for_lean_cache.py --resolve-tooling \
            --repo "$GITHUB_REPOSITORY" --sha "$HEAD_SHA" --workflow pr-build.yml

      - name: Checkout trusted producer contract
        if: needs.classify.outputs.cold != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.producer-tooling.outputs.tooling_sha || needs.classify.outputs.base_sha }}
          path: gate
          persist-credentials: false

      - name: Wait for exact-input producer outputs
        id: outputs
        if: needs.classify.outputs.cold != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER: ${{ needs.classify.outputs.lean_producer }}
          HEAD_SHA: ${{ needs.classify.outputs.checkout_ref }}
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          PRODUCER_RUN_ID: ${{ steps.producer-tooling.outputs.run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.producer-tooling.outputs.run_attempt }}
        run: |
          input=$(bash gate/scripts/ci-build-cache-key.sh . "$HEAD_SHA")
          contract=$(bash gate/scripts/ci-build-contract.sh gate)
          workflow=$PRODUCER
          producer_sha=$BASE_SHA
          producer_args=()
          if [[ "$workflow" == pr-build.yml ]]; then
            producer_sha=$HEAD_SHA
            test -n "$PRODUCER_RUN_ID"
            test -n "$PRODUCER_RUN_ATTEMPT"
            producer_args=(--producer-run-id "$PRODUCER_RUN_ID" --producer-run-attempt "$PRODUCER_RUN_ATTEMPT")
          fi
          python3 scripts/docs/wait_for_lean_cache.py --repo "$GITHUB_REPOSITORY" \
            --sha "$producer_sha" --workflow "$workflow" "${producer_args[@]}" \
            --key "kip126-main-build-v2-${{ runner.os }}-${{ runner.arch }}-$input" \
            --key "kip126-pr-build-v1-${{ runner.os }}-${{ runner.arch }}-$input-$contract"

      - name: Restore exact-input Lean outputs
        id: lean-cache
        if: needs.classify.outputs.cold != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: base/.lake/build
          key: ${{ steps.outputs.outputs.key }}
          fail-on-cache-miss: true

      - name: Adopt restored Lean outputs
        if: steps.lean-cache.outputs.cache-matched-key != ''
        run: |
          mkdir -p .lake/build
          cp -a base/.lake/build/. .lake/build/

      - name: Restore main checkdecls build
        id: checkdecls-cache
        if: needs.classify.outputs.cold != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages/checkdecls/.lake/build
          key: kip126-checkdecls-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}

      - name: Build Lean and check Blueprint declarations
        env:
          BUILD_MODE: ${{ needs.classify.outputs.cold == 'true' && 'cold' || 'incremental' }}
        run: |
          printf '| Command | Elapsed | Exit |\n| --- | ---: | ---: |\n' >> "$GITHUB_STEP_SUMMARY"
          bash scripts/docs/measure.sh mathlib-cache-get metrics/links.tsv \
            bash -o pipefail -c 'lake exe cache get 2>&1 | tee metrics/mathlib-cache.log'
          if grep -qF 'No files to download' metrics/mathlib-cache.log; then
            echo "Mathlib cache result: full hit" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Mathlib cache result: downloaded or refreshed files" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$BUILD_MODE" == cold ]]; then
            bash scripts/docs/measure.sh lake-build-cold metrics/links.tsv lake build
          else
            bash scripts/docs/measure.sh lean-output-validation metrics/links.tsv lake build --no-build
          fi
          bash scripts/docs/measure.sh "checkdecls-$BUILD_MODE" metrics/links.tsv \
            lake exe checkdecls blueprint-component/lean_decls
          if [[ "$BUILD_MODE" == cold ]]; then
            bash scripts/docs/measure.sh lake-build-hot metrics/links.tsv lake build
            bash scripts/docs/measure.sh checkdecls-hot metrics/links.tsv \
              lake exe checkdecls blueprint-component/lean_decls
          fi

      - name: Share checked Lean outputs with API docs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-lean-outputs
          path: .lake/build
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      - name: Save main checkdecls build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.outputs.cold != 'true' && steps.checkdecls-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages/checkdecls/.lake/build
          key: kip126-checkdecls-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}

      - name: Record Lean cache state
        run: |
          echo "Trusted Lean cache hit: ${{ steps.lean-cache.outputs.cache-hit || 'not restored' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "checkdecls cache hit: ${{ steps.checkdecls-cache.outputs.cache-hit || 'not restored' }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('metrics/links.tsv') != ''
        with:
          name: lean-link-build-metrics
          path: metrics/links.tsv
          retention-days: 30

  deploy:
    needs: [classify, blueprint, docs, links]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.classify.outputs.checkout_ref }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-blueprint
          path: components/blueprint

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-docs
          path: components/docs

      - name: Assemble Pages site
        run: |
          python3 scripts/docs/assemble_site.py \
            --blueprint components/blueprint \
            --docs components/docs \
            --output _site \
            --sha '${{ needs.classify.outputs.checkout_ref }}' \
            --repository "$GITHUB_REPOSITORY"
          test -s _site/blueprint/index.html
          test -s _site/docs/index.html
          test -s _site/index.html

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
