name: Auto-merge

# Merge a PR automatically once it is genuinely ready, WITHOUT generating any reviews here (that is
# expensive — it spends API budget — and is gated off in review.yml). Reviews are produced by people
# running kip126-review / kip126 locally, which push the verdict ledger to the reviews branch and
# post the scoreboard comment. A scoreboard publication alone does not arm merging: the trusted
# Reviewer explicitly dispatches this workflow only after deciding no Blueprint sync is required.
#
# The local merge gate reads KIP126's exact-head statuses and the trusted TauCeti scoreboard. In
# the fallback path it serializes all events through one persistent merge-train head. Only that PR is
# updated from main and rechecked, so later candidates do not spend review budget on heads that an
# earlier merge would immediately invalidate. The gate never rewrites forks, runs a reviewer directly,
# accepts out-of-scope changes, or uses an App secret.

on:
  # Head is freshly green: re-check whether this PR is now mergeable.
  workflow_run:
    workflows: ["pr-build", "blueprint-pr"]
    types: [completed]
  # Trusted Reviewer handoff after an exact-head green scoreboard and the no-sync decision.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to evaluate"
        required: true
        type: string
      dry_run:
        description: "Evaluate without enqueueing"
        type: boolean
        default: false

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  # Shared with merge-sweep.yml: cross-PR events may never race to claim two train heads.
  group: kip126-merge-train
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    # Only react to a successful build or an explicit trusted Reviewer handoff.
    if: >
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'pull_request_target')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr != '')
    outputs:
      pr: ${{ steps.r.outputs.pr }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          DISPATCH_PR: ${{ inputs.pr || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [[ "$DISPATCH_PR" =~ ^[0-9]+$ ]]
            echo "pr=$DISPATCH_PR" >> "$GITHUB_OUTPUT"
          else
            pr="${{ github.event.workflow_run.pull_requests[0].number }}"
            if [ -z "$pr" ]; then
              pr=$(gh api "repos/$REPO/commits/${{ github.event.workflow_run.head_sha }}/pulls" --jq '.[0].number // empty')
            fi
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
          fi

  merge:
    needs: resolve
    if: ${{ needs.resolve.outputs.pr != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Evaluate KIP126 merge gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.resolve.outputs.pr }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          args=(--repo "$REPO" --pr "$PR")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/merge_gate.py "${args[@]}"
