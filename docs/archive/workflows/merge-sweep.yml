name: Merge sweep

# Advance one fallback merge-train head after main moves or an event was missed. This repository has
# no native merge queue, so the workflow marks exactly one exact-head-green candidate, updates only
# that same-repository branch when it is BEHIND, and waits for its refreshed exact-head gates before
# another PR may advance. Forks, conflicts, hold-labelled PRs, and ambiguous evidence remain
# human-owned and fail closed.

on:
  push:
    branches: [main]
  schedule:
    - cron: "40 * * * *"   # hourly, offset from housekeeping (:20) and the daily bump
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List merge and branch-update actions without mutating"
        type: boolean
        default: false

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  # Shared with auto-merge.yml: only one coordinator may claim or advance the persistent train head.
  group: kip126-merge-train
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Advance one KIP126 merge-train candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          args=(--repo "$REPO" --all-open)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/merge_gate.py "${args[@]}"
