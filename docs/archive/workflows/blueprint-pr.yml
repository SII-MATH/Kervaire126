name: blueprint-pr

# Mechanical checks are independent of automatic-merge review scope. Mixed PRs
# contribute only explicitly staged sources to trusted tooling and run offline.
# Only pure Blueprint PRs own build/scope/bump-guard here; all other PRs are
# owned by pr-build, even when their Blueprint check fails.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "blueprint/src/**"
  workflow_dispatch:
    inputs:
      pr: { description: "Blueprint PR number to check", required: true, type: string }
      producer_run_id:
        description: "Explicit pr-build dispatch run for diagnostic testing (optional)"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: blueprint-pr-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  # Deliberately not named `build` or `blueprint`: those authoritative contexts are commit statuses
  # posted below, so GitHub cannot confuse an automatic check-run with the merge-gate status.
  blueprint-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Resolve exact PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          DISPATCH_PR: ${{ inputs.pr || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request_target ]]; then
            PR="$EVENT_PR"
          else
            [[ "$DISPATCH_PR" =~ ^[0-9]+$ ]]
            PR="$DISPATCH_PR"
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          test "$(jq -r .state "$RUNNER_TEMP/pr.json")" = open
          {
            echo "number=$PR"
            echo "head_sha=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")"
            echo "head_repo=$(jq -r .head.repo.full_name "$RUNNER_TEMP/pr.json")"
            echo "base_sha=$(jq -r .base.sha "$RUNNER_TEMP/pr.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout workflow-pinned trusted projection tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: gate
          persist-credentials: false
          fetch-depth: 1

      - name: Classify the source boundary and diff size
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
        shell: bash
        run: |
          set -euo pipefail
          files=$(python3 gate/scripts/ci_merge_group_files.py "$GITHUB_REPOSITORY" \
            "$BASE_SHA" "$HEAD_SHA" --head-repository "$HEAD_REPO" --merge-base --names)
          printf '%s\n' "$files"
          scope_ok=true
          mixed=false
          reason='Blueprint-only source change'
          if [[ -z "$files" ]]; then
            scope_ok=false
            reason='changed-file list is empty or unavailable'
          elif grep -qvE '^blueprint/src/' <<<"$files"; then
            # Classify ownership before any eligibility check. Docs/scripts in a
            # mixed PR must never make this workflow overwrite pr-build statuses.
            mixed=true
            reason='mixed development PR; using trusted render configuration'
          fi

          {
            echo "ok=$scope_ok"
            echo "mixed=$mixed"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve executable candidate eligibility
        id: eligible
        if: always()
        env:
          SCOPE_OK: ${{ steps.scope.outputs.ok }}
        run: |
          echo "ok=${SCOPE_OK:-false}" >> "$GITHUB_OUTPUT"

      - name: Compute the trusted PR-build contract
        id: build-contract
        if: steps.eligible.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f gate/scripts/ci-build-contract.sh
          digest=$(bash gate/scripts/ci-build-contract.sh gate)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Trusted PR-build contract: $digest"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.eligible.outputs.ok == 'true'
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          path: candidate
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 100
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Checkout trusted base configuration
        if: steps.eligible.outputs.ok == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: work
          persist-credentials: false

      - name: Stage Blueprint source without candidate tooling
        if: steps.eligible.outputs.ok == 'true'
        run: python3 gate/scripts/stage-blueprint.py work candidate

      - name: Compute the trusted build-input cache key
        id: build-cache-key
        if: steps.eligible.outputs.ok == 'true'
        run: |
          digest=$(bash gate/scripts/ci-build-cache-key.sh candidate HEAD)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Set up the pinned Blueprint renderer
        if: steps.eligible.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          packages=(ghostscript graphviz libgraphviz-dev pdf2svg pkg-config texlive-latex-base)
          sudo timeout --kill-after=10s 180s apt-get -o Acquire::Retries=3 update
          sudo timeout --kill-after=10s 600s apt-get -o Acquire::Retries=3 install --yes "${packages[@]}"
          python3 -m venv "$RUNNER_TEMP/blueprint-venv"
          "$RUNNER_TEMP/blueprint-venv/bin/pip" install -r gate/requirements-blueprint.txt
          echo "$RUNNER_TEMP/blueprint-venv/bin" >> "$GITHUB_PATH"

      - name: Install and verify the offline sandbox
        if: steps.eligible.outputs.ok == 'true'
        env:
          LANDRUN_SHA256: 645178e3239cd33760560834e50efea0864183a2a8a82faf199760dffee6dd71
          LANDRUN_VER: v0.1.14
        run: |
          curl -sSL -H "Accept: application/octet-stream" \
            "https://github.com/Zouuup/landrun/releases/download/${LANDRUN_VER}/landrun-linux-amd64" -o landrun
          echo "${LANDRUN_SHA256}  landrun" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"; install -m 0755 landrun "$HOME/.local/bin/landrun"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          landrun --version || true
          # Prove the sandbox enforces before trusting it with PR code: run works, out-of-tree
          # write denied, /dev/shm write denied, network denied without the flag.
          set +e
          landrun --rox /usr --rox /etc --rw /dev/null -- bash -c 'echo ok' >/dev/null 2>&1; ok=$?
          landrun --rox /usr --rox /etc --rw /dev/null -- bash -c 'echo x > /etc/landrun-probe' >/dev/null 2>&1; wr=$?
          landrun --rox /usr --rox /etc --rw /dev/null -- bash -c 'echo x > /dev/shm/landrun-probe' >/dev/null 2>&1; shm=$?
          landrun --rox /usr --rox /etc --rw /dev/null -- bash -c 'curl -sS --max-time 8 https://example.com >/dev/null' >/dev/null 2>&1; net=$?
          set -e
          echo "self-test: run=$ok write=$wr shm=$shm net=$net (nonzero = denied for w/shm/net)"
          if [ $ok -ne 0 ] || [ $wr -eq 0 ] || [ $shm -eq 0 ] || [ $net -eq 0 ]; then
            echo "::error::landrun not enforcing (run=$ok write=$wr shm=$shm net=$net); refusing to run PR code"; exit 1
          fi

      - name: Render Blueprint before waiting for Lean
        id: render
        if: steps.eligible.outputs.ok == 'true'
        run: bash gate/scripts/blueprint-sandbox.sh render

      - name: Report early Blueprint render result
        if: always() && steps.pr.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: |
          state=failure
          [[ "$RENDER_OUTCOME" != success ]] || state=success
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f context=blueprint-render -f state="$state" \
            -f description='Blueprint rendering; declaration validation is reported separately' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Stage Lean sources against the trusted producer configuration
        if: steps.eligible.outputs.ok == 'true'
        run: python3 gate/scripts/stage-blueprint.py work candidate --lean

      - name: Prepare trusted Lean and Mathlib dependencies
        if: steps.eligible.outputs.ok == 'true'
        run: |
          curl -sSfL --retry 3 https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          bash elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          cd work
          lake exe cache get

      - name: Wait for the shared Lean producer
        id: outputs
        if: steps.eligible.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          INPUT: ${{ steps.build-cache-key.outputs.digest }}
          CONTRACT: ${{ steps.build-contract.outputs.digest }}
          MIXED: ${{ steps.scope.outputs.mixed }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id || '' }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          workflow=ci.yml
          producer_sha=$BASE_SHA
          if [[ "$MIXED" == true ]]; then
            workflow=pr-build.yml
            producer_sha=$HEAD_SHA
          fi
          diagnostic=()
          if [[ -n "$PRODUCER_RUN_ID" ]]; then
            diagnostic=(--producer-run-id "$PRODUCER_RUN_ID" --cache-ref "$WORKFLOW_REF")
          fi
          python3 gate/scripts/docs/wait_for_lean_cache.py --repo "$GITHUB_REPOSITORY" \
            "${diagnostic[@]}" \
            --sha "$producer_sha" --workflow "$workflow" \
            --key "kip126-main-build-v2-${{ runner.os }}-${{ runner.arch }}-$INPUT" \
            --key "kip126-pr-build-v1-${{ runner.os }}-${{ runner.arch }}-$INPUT-$CONTRACT"

      - name: Restore exact-input producer outputs
        id: lean-cache
        if: steps.eligible.outputs.ok == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: base/.lake/build
          key: ${{ steps.outputs.outputs.key }}
          fail-on-cache-miss: true

      - name: Adopt restored Lean outputs
        if: steps.eligible.outputs.ok == 'true' && steps.lean-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          mkdir -p work/.lake/build
          cp -a base/.lake/build/. work/.lake/build/

      - name: Restore the checkdecls tool build
        if: steps.eligible.outputs.ok == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages/checkdecls/.lake/build
          key: kip126-checkdecls-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('work/lean-toolchain', 'work/lake-manifest.json', 'work/lakefile.lean') }}

      - name: Build Blueprint and verify declaration mappings
        id: blueprint
        if: steps.eligible.outputs.ok == 'true'
        run: |
          if [[ -d .lake/packages/checkdecls/.lake/build ]]; then
            mkdir -p work/.lake/packages/checkdecls/.lake/build
            cp -a .lake/packages/checkdecls/.lake/build/. work/.lake/packages/checkdecls/.lake/build/
          fi
          bash gate/scripts/blueprint-sandbox.sh declarations

      - name: Publish exact-head mechanical statuses
        if: always() && steps.pr.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          SCOPE_OK: ${{ steps.scope.outputs.ok }}
          ELIGIBLE: ${{ steps.eligible.outputs.ok }}
          MIXED: ${{ steps.scope.outputs.mixed }}
          SCOPE_REASON: ${{ steps.scope.outputs.reason }}
          BLUEPRINT_OUTCOME: ${{ steps.blueprint.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          post_fail=0
          post_status() {
            local context="$1" state="$2" description="$3" attempt
            for attempt in 1 2 3; do
              if gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
                   -f state="$state" -f context="$context" -f description="$description" \
                   -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; then
                return 0
              fi
              [[ "$attempt" == 3 ]] || sleep $(( attempt * 5 ))
            done
            echo "::error::could not publish $context status"
            post_fail=1
          }

          if [[ "$ELIGIBLE" == true ]]; then
            scope_state=success
            scope_desc='Blueprint source staging and mechanical checks passed'
          else
            scope_state=failure
            if [[ "$MIXED" == true ]]; then
              scope_desc='mixed PR input staging failed; see the failed step'
            else
              scope_desc="$SCOPE_REASON"
            fi
          fi
          if [[ "$ELIGIBLE" == true && "$BLUEPRINT_OUTCOME" == success ]]; then
            blueprint_state=success
            blueprint_desc='Blueprint web build and Lean declaration mapping passed'
          else
            blueprint_state=failure
            blueprint_desc='Blueprint mechanical check failed or was not run'
          fi

          post_status blueprint "$blueprint_state" "$blueprint_desc"
          if [[ "$MIXED" == false ]]; then
            post_status scope "$scope_state" "$scope_desc"
            post_status bump-guard success 'not applicable to Blueprint-only source changes'
            post_status build "$blueprint_state" "$blueprint_desc"
          fi
          [[ "$post_fail" == 0 && "$blueprint_state" == success ]]
