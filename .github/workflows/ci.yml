name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check sources, interfaces, Blueprint dependencies and importers
        run: bash scripts/check.sh
      - name: Upload Blueprint dependency report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blueprint-dependencies
          path: metrics/frontier/
          if-no-files-found: error

  lean:
    name: Lean and Blueprint
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          lfs: true
      - name: Check pinned LFS objects
        run: git lfs fsck
      - name: Restore caches and build the complete Lean library and its regression modules
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: true
          build-args: KIP126
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Install Blueprint dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes \
            ghostscript graphviz libgraphviz-dev pdf2svg pkg-config texlive-latex-base
          python3 -m venv "$RUNNER_TEMP/blueprint-venv"
          "$RUNNER_TEMP/blueprint-venv/bin/pip" install -r requirements-blueprint.txt
          echo "$RUNNER_TEMP/blueprint-venv/bin" >> "$GITHUB_PATH"
      - name: Render Blueprint and check linked Lean declarations
        run: bash scripts/check-blueprint-decls.sh
      - name: Upload Blueprint for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blueprint-web
          path: |
            blueprint/web/
            blueprint/lean_decls
          if-no-files-found: error
