name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          lfs: true
      - name: Check pinned LFS objects
        run: git lfs fsck
      - name: Check sources, interfaces, Blueprint dependencies and importers
        run: bash scripts/check.sh
      - name: Upload Blueprint dependency report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blueprint-dependencies
          retention-days: 7
          path: metrics/frontier/
          if-no-files-found: error

  lean:
    name: Lean and Blueprint
    runs-on: ubuntu-24.04
    # The build is capped separately; allow cache transfers and checks to finish.
    timeout-minutes: 165
    permissions:
      contents: read
      actions: read
    env:
      LEAN_NUM_THREADS: '2'
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Ensure space for build products, cache extraction and swap
        run: |
          available_kib=$(df --output=avail . | tail -n 1)
          if (( available_kib < 40 * 1024 * 1024 )); then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          fi
          df -h .
      - name: Add swap for the generated finite certificates
        run: |
          sudo fallocate -l 8G "$RUNNER_TEMP/lean-swap"
          sudo chmod 600 "$RUNNER_TEMP/lean-swap"
          sudo mkswap "$RUNNER_TEMP/lean-swap"
          sudo swapon "$RUNNER_TEMP/lean-swap"
      - name: Record and monitor runner resources
        run: |
          nproc
          free -m
          df -h .
          python3 -u scripts/monitor-ci-resources.py > "$RUNNER_TEMP/lean-resources.log" 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/lean-resources.pid"
      - name: Identify Lean build inputs
        id: lean-inputs
        run: |
          # The complete tracked tree also binds artifact handoffs to CI/config inputs.
          source_hash=$(python3 scripts/ci_build_artifact.py fingerprint)
          echo "hash=$source_hash" >> "$GITHUB_OUTPUT"
      - name: Start Blueprint environment setup
        run: |
          (
            set -euo pipefail
            finish_setup() {
              echo "$?" > "$RUNNER_TEMP/blueprint-setup.exit.tmp"
              mv "$RUNNER_TEMP/blueprint-setup.exit.tmp" "$RUNNER_TEMP/blueprint-setup.exit"
            }
            trap finish_setup EXIT
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends \
              graphviz libgraphviz-dev pkg-config texlive-binaries
            python3 -m venv "$RUNNER_TEMP/blueprint-venv"
            "$RUNNER_TEMP/blueprint-venv/bin/pip" install -r requirements-blueprint.txt
          ) > "$RUNNER_TEMP/blueprint-setup.log" 2>&1 < /dev/null &
      - name: Restore compiled Lean dependencies and project
        id: lake-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # Keep the path and fallback prefix compatible with lean-action's cache.
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-build-v3-${{ steps.lean-inputs.outputs.hash }}-complete
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-build-v3-${{ steps.lean-inputs.outputs.hash }}-
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-build-v3-
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-sources-v2-
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - name: Reuse the successful PR build after merging
        timeout-minutes: 5
        continue-on-error: true
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && steps.lake-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_build_artifact.py restore --os '${{ runner.os }}' --arch '${{ runner.arch }}'
      - name: Finish Blueprint environment setup
        run: |
          for attempt in {1..300}; do
            if test -f "$RUNNER_TEMP/blueprint-setup.exit"; then
              cat "$RUNNER_TEMP/blueprint-setup.log"
              status=$(cat "$RUNNER_TEMP/blueprint-setup.exit")
              if (( status != 0 )); then exit "$status"; fi
              echo "$RUNNER_TEMP/blueprint-venv/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/blueprint-setup.log"
          echo 'Blueprint environment setup did not finish within five minutes.' >&2
          exit 1
      - name: Install the pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Replace legacy full-Mathlib build artifacts
        if: steps.lake-cache.outputs.cache-matched-key != '' && !contains(steps.lake-cache.outputs.cache-matched-key, '-sources-v2-') && !contains(steps.lake-cache.outputs.cache-matched-key, '-build-v3-')
        run: |
          # Keep project artifacts and the cache tool; fetch the required Mathlib closure below.
          rm -rf .lake/packages/mathlib/.lake/build/lib/lean/Mathlib \
            .lake/packages/mathlib/.lake/build/ir/Mathlib
      - name: Fetch the Mathlib dependencies imported by this project
        if: steps.lake-cache.outputs.cache-hit != 'true'
        run: |
          python3 scripts/mathlib-cache-roots.py > "$RUNNER_TEMP/mathlib-roots.txt"
          mapfile -t mathlib_roots < "$RUNNER_TEMP/mathlib-roots.txt"
          if (( ${#mathlib_roots[@]} )); then
            lake exe cache get "${mathlib_roots[@]}"
          fi
      - name: Build the complete Lean library, regression modules and declaration checker
        id: lean-build
        # Leave time to preserve completed modules before the job's hard limit.
        timeout-minutes: 105
        run: lake build KIP126 checkdecls
      - name: Save the complete Lean build before Blueprint checks
        timeout-minutes: 8
        if: steps.lake-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}
      - name: Preserve completed modules after a failed build
        timeout-minutes: 8
        if: always() && (steps.lean-build.outcome == 'failure' || steps.lean-build.outcome == 'cancelled') && steps.lean-inputs.outputs.hash != '' && hashFiles('.lake/build/**/*.trace') != ''
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          # A new attempt must be able to save more progress than the previous one.
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-build-v3-${{ steps.lean-inputs.outputs.hash }}-progress-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Render Blueprint and check linked Lean declarations
        env:
          # The minimal TeX installation has no texlive-base search-path defaults.
          TEXINPUTS: '.:'
        run: bash scripts/check-blueprint-decls.sh
      - name: Verify incremental compilation at the M08 and M16 handoffs
        id: module-boundaries
        timeout-minutes: 30
        run: python3 scripts/benchmark_module_boundaries.py --output "$RUNNER_TEMP/module-boundary-benchmark"
      - name: Upload module boundary compilation evidence
        if: always() && steps.module-boundaries.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: module-boundary-benchmark
          retention-days: 7
          path: ${{ runner.temp }}/module-boundary-benchmark/
          if-no-files-found: error
      - name: Package the successful PR build for its eventual merge
        id: build-handoff
        timeout-minutes: 10
        continue-on-error: true
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: python3 scripts/ci_build_artifact.py pack --output "$RUNNER_TEMP/lean-build-handoff" --os '${{ runner.os }}' --arch '${{ runner.arch }}'
      - name: Publish the PR build for reuse after merging
        timeout-minutes: 5
        continue-on-error: true
        if: steps.build-handoff.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-build-v1-${{ steps.lean-inputs.outputs.hash }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/lean-build-handoff/
          compression-level: 0
          retention-days: 3
          overwrite: true
          if-no-files-found: error
      - name: Upload Blueprint for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blueprint-web
          retention-days: 7
          path: |
            blueprint/web/
            blueprint/lean_decls
          if-no-files-found: error
      - name: Stop resource monitor and show final samples
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/lean-resources.pid"; then
            kill "$(cat "$RUNNER_TEMP/lean-resources.pid")" 2>/dev/null || true
          fi
          if test -f "$RUNNER_TEMP/lean-resources.log"; then
            tail -n 12 "$RUNNER_TEMP/lean-resources.log"
          fi
      - name: Upload resource diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-resources
          path: |
            ${{ runner.temp }}/lean-resources.log
            ${{ runner.temp }}/blueprint-setup.log
          retention-days: 7
          if-no-files-found: ignore
